
name: PS4 Port - Toolchain Check

on:
  workflow_dispatch:
  push:
    branches:
      - ps4-port
    paths:
      - ".github/workflows/ps4-build.yml"

jobs:
  check-toolchain:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Check OpenOrbis release
        run: |
          curl -fsSL \
            https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest \
            -o release.json

          echo "OpenOrbis release:"
          jq -r '.tag_name' release.json

          echo "Available downloads:"
          jq -r '.assets[] | [.name, .browser_download_url] | @tsv' release.json \
            | tee openorbis-assets.txt

      - name: Check EasyRPG PS4 configuration
        run: |
          grep -n -A 3 'elseif(PS4)' CMakeLists.txt

      - name: Save diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: ps4-toolchain-report
          path: openorbis-assets.txt
