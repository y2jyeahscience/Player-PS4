
name: PS4 Port - OpenOrbis Setup Test

on:
  workflow_dispatch:
  push:
    branches:
      - ps4-port

jobs:
  setup-openorbis:
    runs-on: ubuntu-22.04

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar

      - name: Download OpenOrbis v0.5.4
        run: |
          curl -fL \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o openorbis.tar.gz

      - name: Inspect OpenOrbis package
        run: |
          mkdir openorbis
          tar -xzf openorbis.tar.gz -C openorbis
          find openorbis -maxdepth 5 -type f | sort > openorbis-report.txt
          echo "Package extracted successfully."
          echo "First files found:"
          sed -n '1,80p' openorbis-report.txt

      - name: Upload OpenOrbis report
        uses: actions/upload-artifact@v4
        with:
          name: openorbis-install-report
          path: openorbis-report.txt
          
